# Two separate deployments, usually on two machines:
#   docker compose up -d monitoring    # on the monitoring VPS (agents connect here)
#   docker compose up -d management    # on the management VM / CT
# Updates: docker compose pull && docker compose up -d, or the "Mettre à jour" button through
# the watchtower service below (start it beside each role: docker compose up -d monitoring watchtower).
# Both roles listen on port 3000; on the same host, give one another host port:
#   HLT_MANAGEMENT_PORT=3001 docker compose up -d monitoring management
x-hardening: &hardening
  restart: unless-stopped
  read_only: true
  tmpfs: [/tmp]
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]

services:
  monitoring:
    <<: *hardening
    image: ghcr.io/midnights-ra1n/homelab-management:latest
    container_name: hlt-monitoring
    ports:
      - "${HLT_MONITORING_PORT:-3000}:3000"
    volumes:
      - monitoring-data:/data
    environment:
      HLT_ROLE: monitoring
      HLT_WATCHTOWER_URL: "http://watchtower:8080"
      HLT_WATCHTOWER_TOKEN: "change-me-long-random-token"
      # Public address: agents install command and CSRF check.
      HLT_PUBLIC_URL: "https://monitoring.example.fr"
      # Reverse proxies allowed to set X-Forwarded-For / X-Forwarded-Proto.
      HLT_TRUSTED_PROXIES: "172.16.0.0/12"
      # Push notifications for the iOS / macOS app (docs/API-APPLE.md), with the key mounted below.
      # HLT_APNS_KEY: /run/secrets/apns.p8
      # HLT_APNS_KEY_ID: "ABC123DEFG"
      # HLT_APNS_TEAM_ID: "TEAM123456"
      # HLT_APNS_TOPIC: "fr.midnights.monitoring"
    # volumes: add - ./AuthKey_ABC123DEFG.p8:/run/secrets/apns.p8:ro (readable by uid 65532, the nonroot user)
    labels: ["com.centurylinklabs.watchtower.enable=true"]
    deploy:
      resources:
        limits: { memory: 256M, cpus: "1.0" }

  management:
    <<: *hardening
    image: ghcr.io/midnights-ra1n/homelab-management:latest
    container_name: hlt-management
    ports:
      - "${HLT_MANAGEMENT_PORT:-3000}:3000"
    volumes:
      # To take over homelab-management: copy its homelab.db, secret.key and uploads/ here.
      - management-data:/data
    environment:
      HLT_ROLE: management
      HLT_WATCHTOWER_URL: "http://watchtower:8080"
      HLT_WATCHTOWER_TOKEN: "change-me-long-random-token"
      HLT_PUBLIC_URL: "https://gestion.example.fr"
      HLT_TRUSTED_PROXIES: "172.16.0.0/12"
    labels: ["com.centurylinklabs.watchtower.enable=true"]
    deploy:
      resources:
        limits: { memory: 256M, cpus: "1.0" }

  # Updates the labelled containers only when the server asks (HTTP API, no periodic poll).
  # It holds the Docker socket, so it publishes no port: only the servers on this network reach it.
  watchtower:
    image: nickfedor/watchtower:latest
    container_name: hlt-watchtower
    restart: unless-stopped
    command: ["--http-api-update", "--label-enable", "--cleanup"]
    environment:
      WATCHTOWER_HTTP_API_TOKEN: "change-me-long-random-token"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock

volumes:
  monitoring-data:
  management-data:
