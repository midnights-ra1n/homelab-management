<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#191e27" />
    <title>Hors ligne · Homelab</title>
    <style>
      :root { color-scheme: dark; }
      html, body { margin: 0; height: 100%; background: #191e27; color: #dde1ea;
        font-family: ui-sans-serif, system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
      main { min-height: 100%; display: grid; place-items: center; padding: 2rem; text-align: center; }
      .card { max-width: 22rem; padding: 2rem; border-radius: 2rem; background: #212730; border: 1px solid #39404d;
        box-shadow: 0 0 32px 6px rgba(63,191,166,.2); }
      p.k { font: 500 .75rem ui-monospace, monospace; letter-spacing: .18em; text-transform: uppercase; color: #3fbfa6; margin: 0; }
      h1 { color: #f0f4f9; font-size: 1.6rem; margin: 1rem 0 .5rem; }
      p { color: #b4bbc6; line-height: 1.6; }
      button { margin-top: 1rem; border: 0; border-radius: 999px; padding: .75rem 1.5rem; font-weight: 600;
        background: #3fbfa6; color: #12161d; font-size: .95rem; cursor: pointer; }
    </style>
  </head>
  <body>
    <main>
      <div class="card">
        <p class="k">Hors ligne</p>
        <h1>Homelab injoignable</h1>
        <p>Le serveur ne répond pas. Vérifie ta connexion au réseau local ou au VPN.</p>
        <button onclick="location.reload()">Réessayer</button>
      </div>
    </main>
  </body>
</html>
